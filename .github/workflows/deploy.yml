name: 部署猜字谜分站

on:
  push:
    branches: [main]
  workflow_dispatch:

# 分支部署：构建后把 dist 推到 gh-pages 分支，Pages 源指向该分支。
# （该账号「更新 Pages 站点」API 不可用，切不了 GitHub Actions 部署模式，故走分支。）
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_ROOT: ${{ github.workspace }}/content
    steps:
      - name: 检出站点仓
        uses: actions/checkout@v5

      - name: 检出内容仓
        uses: actions/checkout@v5
        with:
          repository: diuci/chinese-character-riddle
          path: content

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成脚本自检
        run: python tools/build-site.py --selftest

      - name: 从内容仓生成站点页面
        run: python tools/build-site.py

      - name: 法律护栏自检
        run: node tools/check-legal.mjs --selftest

      - name: 法律护栏
        run: node tools/check-legal.mjs

      - name: 产物体检自检
        run: python tools/check-pages.py --selftest

      - name: 产物体检
        run: python tools/check-pages.py

      - name: 字号结构闸门自检
        run: node tools/check-typography.mjs --selftest

      - name: 字号结构闸门
        run: node tools/check-typography.mjs

      - name: UI 闸门自检
        run: node tools/check-ui.mjs --selftest

      - name: UI 闸门
        # CNAME 必须是 zimi.diuci.com，title 含「猜字谜」，顶栏乐园组 + 统一页脚 + 令牌逐字节。
        run: node tools/check-ui.mjs

      - name: 构建站点
        run: npm run build
        env:
          SITE_BASE: '/'

      - name: 推 dist 到 gh-pages 分支
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # 先把 dist 搬出去：git clean 会连 node_modules/site/content 一起删，
          # 删完再搬回来，gh-pages 就只剩构建产物。
          cp -r site/.vitepress/dist "$GITHUB_WORKSPACE/.dist-tmp"
          git checkout --orphan gh-pages
          git rm -rf . >/dev/null 2>&1 || true
          git clean -fdx >/dev/null 2>&1 || true
          cp -r "$GITHUB_WORKSPACE/.dist-tmp/." .
          rm -rf "$GITHUB_WORKSPACE/.dist-tmp"
          git add -A
          git commit -m "deploy: 猜字谜分站 $(date -u +%Y%m%dT%H%M%SZ)"
          git push origin gh-pages --force
