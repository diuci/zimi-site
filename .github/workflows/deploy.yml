name: 部署猜字谜分站

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pages 源被锁在 main /（legacy，该账号切不了 GHA 模式）。
# 故构建后把 dist 落到 main 根，Pages 即 serve 它；.nojekyll 禁 Jekyll。
# 防死循环：deploy: 开头的提交是工作流自己推的，遇到就整条跳过。
# 内容仓检出后构建用，提交前删掉，免得混进 main 成 gitlink。
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_ROOT: ${{ github.workspace }}/content
    steps:
      - name: 检出站点仓
        uses: actions/checkout@v5

      - name: 读出当前提交主题
        id: head
        run: echo "msg=$(git log -1 --pretty=%s)" >> "$GITHUB_OUTPUT"

      - name: 检出内容仓
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        uses: actions/checkout@v5
        with:
          repository: diuci/chinese-character-riddle
          path: content

      - name: 设置 Node
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: npm ci

      - name: 生成脚本自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: python tools/build-site.py --selftest

      - name: 从内容仓生成站点页面
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: python tools/build-site.py

      - name: 法律护栏自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-legal.mjs --selftest

      - name: 法律护栏
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-legal.mjs

      - name: 产物体检自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: python tools/check-pages.py --selftest

      - name: 产物体检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: python tools/check-pages.py

      - name: 字号结构闸门自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-typography.mjs --selftest

      - name: 字号结构闸门
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-typography.mjs

      - name: 谜库快照自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/sync-corpus.mjs --selftest

      - name: 谜库快照漂移与冻结检查
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/sync-corpus.mjs --check

      - name: 盘面闸门自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-puzzle.mjs --selftest

      - name: 盘面闸门（快照自洽 + 每日 30 天回放 + 计分）
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-puzzle.mjs

      - name: 工坊闸门自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-forge.mjs --selftest

      - name: 工坊闸门（字库可解 + 挑战编码往返）
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-forge.mjs

      - name: UI 闸门自检
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-ui.mjs --selftest

      - name: UI 闸门
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: node tools/check-ui.mjs

      - name: 构建站点
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: npm run build
        env:
          SITE_BASE: '/'

      - name: 把 dist 落到 main 根并推送
        if: "!startsWith(steps.head.outputs.msg, 'deploy:')"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # dist 与源码并存于根：源码在 tools/、site/，产物在 index.html、assets/、riddles/…
          cp -r site/.vitepress/dist/. .
          # 内容仓只用于构建，提交前删掉，免得混进 main 成 gitlink
          rm -rf content
          git add -A
          # 内容没变时构建产物与上次部署字节相同，git add 后无变更——空提交
          # 也照落：它标记「这次部署发生过」，deploy: 守卫会让下一条流水线整条跳过。
          git commit --allow-empty -m "deploy: 猜字谜分站 $(date -u +%Y%m%dT%H%M%SZ)"
          git push origin main
