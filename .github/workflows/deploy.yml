name: 部署猜字谜分站

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      CONTENT_ROOT: ${{ github.workspace }}/content
    steps:
      - name: 检出站点仓
        uses: actions/checkout@v5

      - name: 检出内容仓
        uses: actions/checkout@v5
        with:
          repository: diuci/chinese-character-riddle
          path: content

      - name: 设置 Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 生成脚本自检
        run: python tools/build-site.py --selftest

      - name: 从内容仓生成站点页面
        run: python tools/build-site.py

      - name: 法律护栏自检
        run: node tools/check-legal.mjs --selftest

      - name: 法律护栏
        run: node tools/check-legal.mjs

      - name: 产物体检自检
        run: python tools/check-pages.py --selftest

      - name: 产物体检
        run: python tools/check-pages.py

      - name: 字号结构闸门自检
        run: node tools/check-typography.mjs --selftest

      - name: 字号结构闸门
        run: node tools/check-typography.mjs

      - name: UI 闸门自检
        run: node tools/check-ui.mjs --selftest

      - name: UI 闸门
        run: node tools/check-ui.mjs

      - name: 构建站点
        run: npm run build
        env:
          SITE_BASE: '/'

      - name: 上传 Pages 产物
        uses: actions/upload-pages-artifact@v3
        with:
          path: site/.vitepress/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到 GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
