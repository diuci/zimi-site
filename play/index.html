    <!-- 首帧之前定色（规范 §4）：与 VitePress 侧同一套 dc-theme 机制，暗色用户不闪白屏。 -->
    <script>
      ;(function () {
        var a = document.querySelector('meta[name="theme-color"]')
        if (a) {
          var t = document.documentElement
          var prefers = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches
          var saved = null
          try { saved = localStorage.getItem('dc-theme') } catch (e) {}
          var mode = saved || (prefers ? 'dark' : 'light')
          t.setAttribute('data-theme', mode)
          t.classList.toggle('dark', mode === 'dark')
          t.classList.toggle('light', mode === 'light')
          var sync = function () {
            a.setAttribute('content', t.getAttribute('data-theme') === 'dark' ? '#17140f' : '#f4ede0')
          }
          sync()
          new MutationObserver(sync).observe(t, { attributes: true, attributeFilter: ['data-theme'] })
        }
      })()
    </script>
